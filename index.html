<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>BNI APEXION – Tạo Avatar</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f6f1e8;color:#5b1717}
.wrap{max-width:620px;margin:auto;padding:20px 14px 35px;text-align:center}
h1{font-size:25px;margin:5px 0 4px}.sub{margin:0 0 16px;color:#6d5b4e}
.stage{position:relative;width:min(94vw,560px);aspect-ratio:1/1;margin:auto;background:#ddd;border-radius:18px;overflow:hidden;box-shadow:0 8px 30px #0002;touch-action:none;user-select:none}
#photo{position:absolute;left:50%;top:50%;width:100%;height:100%;object-fit:cover;transform:translate(-50%,-50%) scale(1);transform-origin:center;display:none;cursor:grab}
#photo.dragging{cursor:grabbing}
#placeholder{position:absolute;inset:0;display:grid;place-items:center;color:#777;font-size:16px;padding:30px;z-index:0}
#frame{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2}
.controls{margin:15px auto 0;max-width:500px}
.zoomrow{display:flex;align-items:center;gap:10px;margin:8px 0 13px}
.zoomrow span{font-size:13px;min-width:55px}.zoomrow output{font-size:13px;min-width:45px;text-align:right}
input[type=range]{flex:1;accent-color:#a80f16}
.buttons{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
button,label{border:0;border-radius:999px;padding:13px 20px;font-weight:700;cursor:pointer}
label{background:#a80f16;color:white}button{background:#c9a35a;color:#321a0e}
button:disabled{opacity:.45;cursor:not-allowed}
.hint{font-size:13px;color:#76695f;margin-top:11px;line-height:1.45}
input[type=file]{display:none}
</style>
</head>
<body>
<div class="wrap">
<h1>BNI APEXION</h1>
<p class="sub">Lễ chuyển giao nhiệm kỳ 5</p>

<div class="stage" id="stage">
  <div id="placeholder">Chọn ảnh để tạo Avatar<br><small>Kéo ảnh để căn vị trí</small></div>
  <img id="photo" alt="">
  <img id="frame" src="bni_apexion_avatar_frame.png" alt="">
</div>

<div class="controls">
  <div class="zoomrow">
    <span>Thu nhỏ</span>
    <input id="zoom" type="range" min="0.7" max="2.5" step="0.01" value="1">
    <span>Phóng to</span>
    <output id="zoomVal">100%</output>
  </div>

  <div class="buttons">
    <label for="file">CHỌN ẢNH</label>
    <button id="reset" disabled>CĂN LẠI</button>
    <button id="download" disabled>TẢI AVATAR</button>
  </div>
</div>

<p class="hint">
  Sau khi chọn ảnh, <b>kéo trực tiếp trên ảnh</b> để di chuyển.<br>
  Dùng thanh trượt để <b>phóng to / thu nhỏ</b> cho khuôn mặt vừa đẹp trong khung.
</p>

<input id="file" type="file" accept="image/*">
</div>

<script>
const file=document.querySelector('#file');
const photo=document.querySelector('#photo');
const frame=document.querySelector('#frame');
const stage=document.querySelector('#stage');
const placeholder=document.querySelector('#placeholder');
const zoom=document.querySelector('#zoom');
const zoomVal=document.querySelector('#zoomVal');
const reset=document.querySelector('#reset');
const download=document.querySelector('#download');

let scale=1, x=0, y=0, dragging=false, startX=0, startY=0, startPX=0, startPY=0;

function update(){
  photo.style.transform=`translate(calc(-50% + ${x}px), calc(-50% + ${y}px)) scale(${scale})`;
  zoomVal.textContent=Math.round(scale*100)+'%';
}

function resetImage(){
  scale=1; x=0; y=0; zoom.value=1; update();
}

file.onchange=e=>{
  const f=e.target.files[0];
  if(!f)return;
  photo.src=URL.createObjectURL(f);
  photo.onload=()=>{
    photo.style.display='block';
    placeholder.style.display='none';
    reset.disabled=false;
    download.disabled=false;
    resetImage();
  };
};

zoom.oninput=()=>{
  scale=parseFloat(zoom.value);
  update();
};

reset.onclick=resetImage;

// Mouse + touch drag
function point(e){
  if(e.touches) return {x:e.touches[0].clientX,y:e.touches[0].clientY};
  return {x:e.clientX,y:e.clientY};
}
function startDrag(e){
  if(!photo.src)return;
  dragging=true;
  photo.classList.add('dragging');
  const p=point(e);
  startX=p.x; startY=p.y; startPX=x; startPY=y;
  e.preventDefault();
}
function moveDrag(e){
  if(!dragging)return;
  const p=point(e);
  x=startPX+(p.x-startX);
  y=startPY+(p.y-startY);
  update();
  e.preventDefault();
}
function endDrag(){
  dragging=false;
  photo.classList.remove('dragging');
}
stage.addEventListener('mousedown',startDrag);
window.addEventListener('mousemove',moveDrag);
window.addEventListener('mouseup',endDrag);
stage.addEventListener('touchstart',startDrag,{passive:false});
window.addEventListener('touchmove',moveDrag,{passive:false});
window.addEventListener('touchend',endDrag);

download.onclick=()=>{
  const c=document.createElement('canvas');
  c.width=1254;c.height=1254;
  const ctx=c.getContext('2d');

  // Draw uploaded image exactly as preview, including zoom and position.
  const iw=photo.naturalWidth, ih=photo.naturalHeight;
  const base=Math.max(c.width/iw,c.height/ih);
  const dw=iw*base*scale, dh=ih*base*scale;
  const dx=(c.width-dw)/2 + x*(c.width/stage.clientWidth);
  const dy=(c.height-dh)/2 + y*(c.height/stage.clientHeight);
  ctx.drawImage(photo,dx,dy,dw,dh);

  ctx.drawImage(frame,0,0,c.width,c.height);

  const a=document.createElement('a');
  a.download='BNI-APEXION-Avatar-NK5.png';
  a.href=c.toDataURL('image/png');
  a.click();
};
</script>
</body>
</html>
