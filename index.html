<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>BNI APEXION – Tạo Avatar</title>
<style>
*{box-sizing:border-box} body{margin:0;font-family:Arial,sans-serif;background:#f6f1e8;color:#5b1717}
.wrap{max-width:560px;margin:auto;padding:20px 16px 36px;text-align:center}
h1{font-size:24px;margin:8px 0 4px}.sub{margin:0 0 16px;color:#6d5b4e}
.stage{position:relative;width:min(94vw,520px);aspect-ratio:1/1;margin:auto;background:#ddd;border-radius:18px;overflow:hidden;box-shadow:0 8px 30px #0002}
#photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none}
#placeholder{position:absolute;inset:0;display:grid;place-items:center;color:#777;font-size:16px;padding:30px}
#frame{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.controls{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px}
button,label{border:0;border-radius:999px;padding:13px 18px;font-weight:700;cursor:pointer}
label{background:#a80f16;color:white}button{background:#c9a35a;color:#321a0e}
input{display:none}.hint{font-size:13px;color:#76695f;margin-top:12px}
</style>
</head>
<body>
<div class="wrap">
<h1>BNI APEXION</h1>
<p class="sub">Lễ chuyển giao nhiệm kỳ 5</p>
<div class="stage" id="stage">
  <div id="placeholder">Chọn ảnh của anh/chị để tạo Avatar sự kiện</div>
  <img id="photo" alt="">
  <img id="frame" src="bni_apexion_avatar_frame.png" alt="">
</div>
<div class="controls">
  <label for="file">CHỌN ẢNH</label>
  <button id="download" disabled>TẢI AVATAR</button>
</div>
<p class="hint">Ảnh sẽ được ghép trực tiếp trên thiết bị của anh/chị.</p>
<input id="file" type="file" accept="image/*">
</div>
<script>
const file=document.querySelector('#file'), photo=document.querySelector('#photo');
const frame=document.querySelector('#frame'), stage=document.querySelector('#stage');
const placeholder=document.querySelector('#placeholder'), download=document.querySelector('#download');
file.onchange=e=>{
 const f=e.target.files[0]; if(!f)return;
 photo.src=URL.createObjectURL(f); photo.style.display='block'; placeholder.style.display='none'; download.disabled=false;
};
download.onclick=()=>{
 const c=document.createElement('canvas'); c.width=1254;c.height=1254;
 const x=c.getContext('2d');
 // Cover the canvas with the uploaded photo.
 const iw=photo.naturalWidth, ih=photo.naturalHeight;
 const scale=Math.max(c.width/iw,c.height/ih);
 const w=iw*scale,h=ih*scale;
 x.drawImage(photo,(c.width-w)/2,(c.height-h)/2,w,h);
 x.drawImage(frame,0,0,c.width,c.height);
 const a=document.createElement('a');a.download='BNI-APEXION-Avatar.png';a.href=c.toDataURL('image/png');a.click();
};
</script>
</body>
</html>
